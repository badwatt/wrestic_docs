version: "3.9"
services:
  wrestic_docs:
    image: node:latest
    container_name: wrestic_docs
    ports:
      - "127.0.0.1:8585:4321"
    restart: unless-stopped
    volumes:
        - .:/project
    security_opt:
      - no-new-privileges:true
    command: >
        sh -c
        "
        cd /project
        && npm install
        && npm run build
        && npm run preview -- --host 0.0.0.0 &
        tail -f /dev/null
        "
