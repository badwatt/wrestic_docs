services:
  wrestic_docs:
    container_name: wrestic_docs
    image: node:latest
    restart: unless-stopped
    volumes:
        - .:/project
    security_opt:
      - no-new-privileges:true
    command: >
        sh -c
        "
        cd /project
        && npm install
        && npm run build
        && npm run preview -- --host 0.0.0.0 &
        tail -f /dev/null
        "
    networks: [proxy]
    labels:
      caddy: wrestic.com
      caddy.import: cloudflare
      caddy.reverse_proxy: "{{upstreams 4321}}"

networks:
  proxy:
    external: {}
