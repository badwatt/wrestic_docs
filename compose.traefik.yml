services:
  wrestic_docs:
    container_name: wrestic_docs
    image: node:latest
    restart: unless-stopped
    volumes:
        - .:/project
    security_opt:
      - no-new-privileges:true
    command: >
        sh -c
        "
        cd /project
        && npm install
        && npm run build
        && npm run preview -- --host 0.0.0.0 &
        tail -f /dev/null
        "
    networks: [proxy]
    labels:
      traefik.enable: true
      traefik.http.routers.wrestic.entrypoints: https
      traefik.http.routers.wrestic.rule: Host(`wrestic.com`)
      traefik.http.services.wrestic.loadbalancer.server.port: 4321

networks:
  proxy:
    external: {}
